<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>DAPE Session Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<style>
/* Layout: single phone column under a sticky top bar with a menu button; home screen of six large task tiles; one student per row like her paper sheet. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#17231d; --muted:#5d6b63; --line:#d5dbd6;
  --accent:#1f6b4a; --accent-ink:#ffffff; --accent-soft:#dcebe2;
  --good:#1f6b4a; --warn:#a85d00; --bad:#a3322a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111815; --surface:#1a231f; --ink:#e8efea; --muted:#9aa9a0; --line:#2f3b35;
  --accent:#58c08f; --accent-ink:#0c1511; --accent-soft:#1f3329;
  --good:#58c08f; --warn:#e0a44a; --bad:#ef8279; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111815; --surface:#1a231f; --ink:#e8efea; --muted:#9aa9a0; --line:#2f3b35;
  --accent:#58c08f; --accent-ink:#0c1511; --accent-soft:#1f3329;
  --good:#58c08f; --warn:#e0a44a; --bad:#ef8279; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:16px}
h1{font:700 28px/1.1 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font:700 20px/1.15 var(--display);margin:0}
.eyebrow{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{align-items:flex-end}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.stack>label,.wrap>label{flex:0 0 auto}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;width:100%;padding:14px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;min-height:56px}
.item:first-child{border-top:0}
.item .nm{font-weight:600;min-width:0;flex:1}
.item .sub{font-weight:400;font-size:14px;color:var(--muted)}
.time{font:700 18px/1 var(--display);font-variant-numeric:tabular-nums;min-width:68px}
.pill{font:600 12px var(--body);padding:3px 9px;border-radius:99px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pill.done{background:var(--accent-soft);color:var(--good);border-color:transparent}
.pill.abs{color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.edit{padding:0 14px 14px;border-top:1px dashed var(--line);padding-top:12px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--good)}
.btn:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
/* Keep the page at screen size on phones. 16px fields stop iPhones zooming in when a field is tapped;
   touch-action stops double-tap zoom; the date and time rules stop iPhone fields spilling out of their column. */
input,select,textarea{font-size:16px;max-width:100%}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
html,body{max-width:100%;overflow-x:hidden}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,select,textarea,label,a{touch-action:manipulation}
label{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:4px;flex:1 1 120px;min-width:0}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font:700 26px var(--display);cursor:pointer}
.stepper input{width:84px;text-align:center;font:700 30px var(--display);font-variant-numeric:tabular-nums;height:52px;padding:4px}
.goal{padding-block:12px;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0;padding-top:0}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 12px;min-height:36px;cursor:pointer;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:560px;margin:0 auto;padding-inline:8px 16px;display:flex;align-items:center;gap:6px;min-height:56px}
.top .brand{font:700 20px/1 var(--display);letter-spacing:.02em;background:none;border:0;color:var(--ink);cursor:pointer;padding:8px 4px}
.top .where{margin-left:auto;font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.burger{width:48px;height:48px;border:0;background:none;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.burger svg{width:24px;height:24px}
.menu{position:fixed;inset:0;z-index:30;background:rgba(10,20,15,.45);display:flex}
.menu .sheet{background:var(--surface);width:min(320px,86vw);height:100%;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column}
.menu .head{display:flex;align-items:center;gap:6px;padding:4px 8px;min-height:56px;border-bottom:1px solid var(--line)}
.menu .go{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 18px;cursor:pointer;color:var(--ink);min-height:56px}
.menu .go b{font:700 19px/1.1 var(--display);letter-spacing:.02em}
.menu .go span{font-size:13px;color:var(--muted)}
.menu .go.on{background:var(--accent-soft)}
.menu .go.on b{color:var(--good)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;min-height:118px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.tile b{font:700 22px/1.05 var(--display);letter-spacing:.01em;text-wrap:balance}
.tile span{font-size:13px;color:var(--muted);line-height:1.3}
.tile.lead{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-height:104px}
.tile.lead span{color:var(--accent-ink);opacity:.85}
.tile .badge{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--muted)}
@media (max-width:340px){.tiles{grid-template-columns:1fr}}
.pill.gone{color:var(--muted);border-style:dashed}
.paysheet{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.paysheet .sect{padding:12px 14px 4px;font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.sect+.pl{border-top:0}
.pl>b{font-weight:600}
.pl>small{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:-2px}
.pl>.sub{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.money{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface);width:124px}
.money input{border:0;padding:8px 0;min-height:38px;width:100%;background:none}
.money input:focus{outline:none}
.money:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.money span{color:var(--muted);font-size:14px}
.sw{width:48px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;flex:0 0 auto;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{left:21px}
@media (prefers-reduced-motion:reduce){.sw::after{transition:none}}
.rates{display:flex;flex-direction:column;gap:8px}
.rate-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 8px;align-items:center}
.rate-row .from{font-size:14px;color:var(--muted)}
.rate-row input[type=date]{width:auto;max-width:100%;min-height:38px;padding:6px 8px;justify-self:start}
.rate-row .pair{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rate-row .money{width:112px;padding:0 8px}
.rate-row+.rate-row{border-top:1px dashed var(--line);padding-top:8px}
.linkbtn{border:0;background:none;color:var(--good);font-weight:600;padding:6px 0;cursor:pointer;text-align:left}
.geo{position:relative;display:block}
.geo-list{position:relative;margin-top:4px;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px rgba(10,20,15,.16);overflow:hidden}
.geo-list button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit;font-weight:400}
.geo-list button:first-child{border-top:0}
.geo-list button b{display:block;font-weight:600;font-size:15px}
.geo-list button span{font-size:13px;color:var(--muted)}
.geo-list button[aria-selected="true"],.geo-list button:hover{background:var(--accent-soft)}
.geo-list .credit{display:block;padding:6px 12px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);text-align:right}
.geo-list .credit a{color:var(--muted)}
.geo-note{padding:10px 12px;font-size:13px;color:var(--muted)}
.example{background:var(--accent-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.example .t{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--good)}
.ex{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.ex .z{color:var(--muted)}
.ex .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:700;font-size:16px}
.split{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:baseline;font-variant-numeric:tabular-nums}
.split .n{font:700 18px/1 var(--display)}
.leg{display:flex;align-items:center;gap:12px;padding:2px 14px;color:var(--muted);font-size:14px}
.leg .dot{flex:0 0 32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--good);display:grid;place-items:center}
.leg .dot svg{width:18px;height:18px}
.leg strong{color:var(--ink);font-weight:600}
.stop{display:flex;flex-direction:column;gap:6px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.steps i{height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-left:1px solid var(--line);background:var(--surface);padding:8px 10px;min-height:40px;cursor:pointer;font:600 13px var(--body);color:var(--muted)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button.on.abs{background:var(--warn);color:var(--surface)}
.wzrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line)}
.wzrow:first-child{border-top:0}
.wzrow .nm{font-weight:600;min-width:0;flex:1 1 140px}
.check{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;min-height:60px}
.check:first-child{border-top:0}
.check .box{flex:0 0 26px;height:26px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;color:var(--accent-ink)}
.check.on .box{background:var(--accent);border-color:var(--accent)}
.check .box svg{width:16px;height:16px}
.sticky-actions{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;background:var(--bg);padding-block:8px}
.banner{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));margin:auto;max-width:400px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;text-align:center;font-weight:600}
.stat{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
svg{display:block;width:100%;height:auto}
svg text{font:500 11px var(--body);fill:var(--muted)}
pre.sum{white-space:pre-wrap;word-break:break-word;font:14px/1.45 var(--body);margin:0;user-select:all}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.sec .eyebrow{flex:1;display:flex;align-items:center;gap:10px}
.sec .eyebrow:after{content:"";flex:1;border-top:1px solid var(--line)}
.tile .warn{font:600 12px var(--body);color:var(--warn)}
.minis{display:flex;flex-wrap:wrap;gap:8px}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 14px;min-height:40px;cursor:pointer;font:600 14px var(--body)}
.menu .grp{font:600 11px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:14px 18px 4px}
.iep{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.iep .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.iep .kv span:nth-child(odd){color:var(--muted)}
.iep ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.pill.todo{color:var(--warn);border-color:var(--warn)}
.obj{border-left:3px solid var(--accent)}
.goaltext{white-space:pre-wrap;font-size:14px}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="pay.js"></script>
<div class="wrap" id="auth" hidden>
  <div class="stack"><span class="eyebrow">DAPE Session Log</span><h1>Sign in</h1></div>
  <form class="panel stack" id="auth-form">
    <label>Email<input type="email" id="auth-email" autocomplete="username" inputmode="email" required></label>
    <label>Password<input type="password" id="auth-pass" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit" id="auth-go">Sign in</button>
  </form>
  <p class="muted" id="auth-msg" role="status"></p>
</div>
<header class="top" id="top" hidden></header>
<div class="wrap" id="app" hidden></div>
<div class="menu" id="menu" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
var S={view:'home',menu:false,wz:{step:1,i:0},legs:[],settings:{},stFilter:'active',progQ:'',agencies:[],agEdit:null,date:today(),students:[],schools:[],sessions:[],activities:[],indirect:[],days:[],indForm:false,loaded:false,db:null,dbState:'wait',
       open:null,draft:null,progId:null,period:'all',editId:null,schoolEdit:null,saving:false};
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var HELP=['Independent','Verbal cue','Demonstration','Hands-on help'];
var CODES=[['401','S/LI','Speech/Language Impaired'],['402','DCD-MM','Developmental Cognitive Disabilities: Mild-Moderate'],['403','DCD-SP','Developmental Cognitive Disabilities: Severe-Profound'],
  ['404','PI','Physically Impaired'],['405','D/HH','Deaf/Hard of Hearing'],['406','B/VI','Blind/Visually Impaired'],['407','SLD','Specific Learning Disabilities'],
  ['408','EBD','Emotional or Behavioral Disorders'],['410','OHD','Other Health Disabilities'],['411','ASD','Autism Spectrum Disorders'],['412','D/D','Developmentally Delayed'],
  ['414','TBI','Traumatic Brain Injury'],['416','SMI','Severely Multiply Impaired'],['420','Aggregate','Special Education Aggregate (three or more disabilities)'],['422','Non-disabled','Non-Disabled (no IEP/IFSP)']];
var app=document.getElementById('app'),topEl=document.getElementById('top'),menuEl=document.getElementById('menu'),toastEl=document.getElementById('toast');

function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function p2(n){return (n<10?'0':'')+n}
function parts(s){var a=s.split('-');return[+a[0],+a[1],+a[2]]}
function md(s){var a=parts(s);return a[1]+'/'+a[2]}
function mdy(s){var a=parts(s);return a[1]+'/'+a[2]+'/'+a[0]}
function longDate(s){var a=parts(s);return new Date(a[0],a[1]-1,a[2]).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}
function shift(s,n){var a=parts(s),d=new Date(a[0],a[1]-1,a[2]+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function dow(s){var a=parts(s);return new Date(a[0],a[1]-1,a[2]).getDay()}
function wk(s){var a=parts(s);return Math.floor((Date.UTC(a[0],a[1]-1,a[2])/864e5+4)/7)} /* Sunday-start week number */
function fmtTime(t){if(!t)return '';var a=t.split(':'),h=+a[0];return ((h+11)%12+1)+':'+a[1]+(h<12?' am':' pm')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rid(){return Math.random().toString(36).slice(2,9)}
function num(v){return typeof v==='number'&&isFinite(v)}
function r1(n){return Math.round(n*10)/10}
function toast(t){toastEl.textContent=t;toastEl.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){toastEl.hidden=true},2600)}
function student(id){return S.students.filter(function(s){return s.id===id})[0]}
function school(id){return S.schools.filter(function(s){return s.id===id})[0]}
function schoolLabel(s){var sc=school(s.schoolId);return sc?(sc.alias||sc.name):(s.site||'')}
function closedOn(sc,date){return (sc.closed||[]).filter(function(c){return date>=c.from&&date<=(c.to||c.from)})[0]}
function slotOn(s,date){var d=dow(date);return (s.slots||[]).filter(function(sl){
  return sl.day===d&&(sl.every!==2||!sl.anchor||(wk(date)-wk(sl.anchor))%2===0)})[0]}
function slotText(sl){return DAYS[sl.day]+' '+fmtTime(sl.time)+', '+sl.min+' min'+(sl.every===2?', every 2 weeks':'')}
function sess(sid,date){return S.sessions.filter(function(x){return x.studentId===sid&&x.date===date})[0]}
function history(sid){return S.sessions.filter(function(x){return x.studentId===sid&&x.status!=='planned'}).sort(function(a,b){return a.date<b.date?-1:1})}
function lastVal(sid,gid,before){var h=history(sid),i;for(i=h.length-1;i>=0;i--){if(h[i].date<before&&h[i].values&&num(h[i].values[gid]))return h[i]}return null}
function active(s){return !s.status||s.status==='active'}
function activeStudents(){return S.students.filter(active)}
var STATUS={active:'Active',graduated:'Graduated',exited:'Exited'};
function agency(id){return S.agencies.filter(function(a){return a.id===id})[0]}
function agencyOfStudent(s){var sc=school(s.schoolId);return sc&&sc.agencyId?agency(sc.agencyId):null}
function dayWord(d){return d===today()?'today':d===shift(today(),1)?'tomorrow':'this day'}
var PAY=window.DAPE_PAY;
function reimburses(a){return PAY.reimburses(a)}
function paysTravel(a){return PAY.paysTravel(a)}
function travelRate(a){return PAY.travelRate(a)}
function officeStart(a){return PAY.officeStart(a)}

/* ---------- data ---------- */
function start(db){
  render();
  (function(){
    if(!db){S.dbState='none';S.loaded=true;render();return}
    S.db=db;S.dbState='ok';var got={};
    function fail(){S.dbState='none';S.loaded=true;render()}
    function sub(name,q,fn){q.onSnapshot(function(snap){fn(snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o}));
      got[name]=1;if(got.students&&got.schools&&got.sessions)S.loaded=true;softRender()},fail)}
    sub('students',db.collection('students'),function(a){a.forEach(function(o){o.goals=o.goals||[];o.slots=o.slots||[]});
      S.students=a.sort(function(x,y){return (x.order||0)-(y.order||0)||String(x.name).localeCompare(y.name)})});
    sub('schools',db.collection('schools'),function(a){S.schools=a.sort(function(x,y){return String(x.name).localeCompare(y.name)})});
    sub('sessions',db.collection('sessions').limit(1000),function(a){S.sessions=a});
    sub('activities',db.collection('activities'),function(a){S.activities=a.sort(function(x,y){return String(x.name).localeCompare(String(y.name))})});
    sub('indirect',db.collection('indirect').limit(1000),function(a){S.indirect=a});
    sub('days',db.collection('days').limit(1000),function(a){S.days=a});
    sub('legs',db.collection('legs'),function(a){S.legs=a});
    sub('settings',db.collection('settings'),function(a){var m={};a.forEach(function(o){m[o.id]=o});S.settings=m});
    sub('agencies',db.collection('agencies'),function(a){S.agencies=a.sort(function(x,y){return String(x.name).localeCompare(String(y.name))})});
  })();
}

    '<button class="brand" data-act="go" data-v="home">DAPE Log</button>'+(cur&&S.view!=='home'?'<span class="where">'+esc(cur[1])+'</span>':'')+'</div>';
  menuEl.hidden=!S.menu;
  menuEl.innerHTML=S.menu?'<div class="sheet" role="dialog" aria-label="Menu"><div class="head"><button class="burger" data-act="menu" aria-label="Close menu">'+CLOSE+'</button><span class="brand" style="font:700 20px var(--display)">DAPE Log</span></div>'+
    NAV.map(function(n,k){return (n[3]&&(k===0||NAV[k-1][3]!==n[3])?'<div class="grp">'+esc(n[3])+'</div>':'')+'<button class="go'+(S.view===n[0]||(S.view==='iep'&&n[0]==='students')?' on':'')+'" data-act="go" data-v="'+n[0]+'"><b>'+esc(n[1])+'</b><span>'+esc(n[2])+'</span></button>'}).join('')+
    '<button class="go" data-act="signout" style="margin-top:auto"><b>Sign out</b><span>You will need your email and password to sign back in</span></button></div>':'';
  var h='';
  if(S.dbState==='none')h+='<div class="banner">Entries can\'t be saved right now. Check your connection, then reload the page.</div>';
  if(S.view==='home')h+=homeView();
  else if(S.view==='today')h+=S.open?entryView():todayView();
  else if(S.view==='plan')h+=wizardView();
  else if(S.view==='progress')h+=progressView();
  else if(S.view==='students')h+=studentsView();
  else if(S.view==='iep')h+=iepView();
  else if(S.view==='agencies')h+=agenciesView();
  else if(S.view==='profile')h+=profileView();

  app.innerHTML=h;

}

function nextReport(){var t=today(),best=null;
  S.schools.forEach(function(sc){(sc.reports||[]).forEach(function(r){if(r.date>=t&&(!best||r.date<best.date))best={date:r.date,school:sc.alias||sc.name}})});return best}
/* What is left to set up. Drive distances count only the drives this week's routes use. */
function setupStatus(){var o={todo:0,schools:'',agencies:'',legs:'',profile:''},n;
  n=S.agencies.filter(function(a){return !num(a.rate)||(reimburses(a)&&!PAY.mileRateOn(a,today()))||(a.travelOwn&&paysTravel(a)&&!num(a.travelRate))||!a.officeAddress}).length;
  if(!S.agencies.length){o.agencies='Add the agencies that pay you';o.todo++}else if(n){o.agencies='Rates or address missing for '+n;o.todo+=n}
  var ns=S.schools.filter(function(sc){return !sc.address||!sc.agencyId||!(sc.days&&sc.days.length)});
  if(!S.schools.length){o.schools='Add your schools';o.todo++}else if(ns.length){o.schools=ns.length+' missing an address, agency or days';o.todo+=ns.length}
  var seen={},miss=0,test=0,i;
  for(i=0;i<7;i++){dayStops(shift(today(),i)).legs.forEach(function(l){var k=legKey(l.from,l.to);if(!seen[k]){seen[k]=1;if(l.miles==null)miss++;else if(l.test)test++}
    if(l.office){var ko=legKey(officeId(agency(l.agencyId)),l.to);if(!seen[ko]){seen[ko]=1;if(l.officeMiles==null)miss++}}})}
  var pm=[me().name?'':'name',me().address?'':'home address'].filter(Boolean);if(pm.length){o.profile='Add your '+pm.join(' and ');o.todo++}
  if(miss||test){o.legs=(o.legs?o.legs+' · ':'')+[miss?miss+' not set':'',test?test+' still test values':''].filter(Boolean).join(', ');o.todo+=miss+test}
  return o}
function emptyRoster(){return '<div class="list"><div class="empty">'+(S.loaded?'No students yet. Add your caseload under Students in the menu, with the goals you track for each.':'Loading your caseload…')+'</div></div>'}

function comingUp(){
  var t=today(),out=[];
  activeStudents().forEach(function(s){if(s.iepNext&&s.iepNext>=t&&s.iepNext<=shift(t,30))out.push({d:s.iepNext,t:'IEP meeting, '+s.name})});
  S.schools.forEach(function(sc){(sc.reports||[]).forEach(function(r){if(r.date>=t&&r.date<=shift(t,21))out.push({d:r.date,t:'Report due, '+(sc.alias||sc.name)+(r.label?' ('+r.label+')':'')})})});
  if(!out.length)return '';
  out.sort(function(a,b){return a.d<b.d?-1:1});
  return '<div class="panel stack"><span class="eyebrow">Coming up</span>'+out.map(function(o){
    return '<div class="row"><span class="time">'+esc(md(o.d))+'</span><span style="flex:1;min-width:0">'+esc(o.t)+'</span></div>'}).join('')+'</div>';

var ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v15M6 13l6 6 6-6"/></svg>';

function dayDoc(date){return S.days.filter(function(x){return x.id===date})[0]||{}}
function placeName(id){if(id==='home')return 'Home';if(String(id).indexOf('office_')===0){var oa=agency(id.slice(7));return oa?oa.name+' office':'Agency office'}var sc=school(id);return sc?(sc.alias||sc.name):'Unknown place'}
function legKey(a,b){return [a,b].sort().join('__')}
function legOf(a,b){var k=legKey(a,b);return S.legs.filter(function(x){return x.id===k})[0]}
/* The day's route: schools in the order of their first session, each with its students, and a drive leg into each school starting from home. */
function dayStops(date,keepSkipped){
  var dd=dayDoc(date),skip=keepSkipped?[]:(dd.skip||[]),skipSc=keepSkipped?[]:(dd.skipSchools||[]),rows=[],grp={};
  activeStudents().forEach(function(s){var sl=slotOn(s,date);if(sl&&skip.indexOf(s.id)<0&&skipSc.indexOf(s.schoolId||'')<0){rows.push({s:s,sl:sl});var k=(s.schoolId||'')+'|'+sl.time;grp[k]=(grp[k]||0)+1}});
  S.sessions.forEach(function(x){if(x.date===date&&!rows.some(function(o){return o.s.id===x.studentId})){var s=student(x.studentId);if(s&&skip.indexOf(s.id)<0)rows.push({s:s,sl:null,extra:true})}});
  var by={},order=[];
  rows.forEach(function(o){var k=o.s.schoolId&&school(o.s.schoolId)?o.s.schoolId:'';if(!by[k]){by[k]={id:k,sc:school(k),rows:[]};order.push(k)}by[k].rows.push(o)});
  function t(o){var x=sess(o.s.id,date);return o.sl?o.sl.time:(x&&x.time)||'99:99'}
  order.forEach(function(k){by[k].rows.sort(function(a,b){return t(a)<t(b)?-1:t(a)>t(b)?1:0});by[k].first=t(by[k].rows[0])});
  var stops=order.map(function(k){return by[k]}).sort(function(a,b){if(!a.id)return 1;if(!b.id)return -1;return a.first<b.first?-1:a.first>b.first?1:0});
  var prev='home',legs=[];
  stops.forEach(function(st){if(!st.id)return;var l=legOf(prev,st.id);
    st.leg={from:prev,to:st.id,miles:l&&num(l.miles)?l.miles:null,min:l&&num(l.min)?l.min:null,test:!!(l&&l.test),agencyId:st.sc.agencyId||''};
    var la=agency(st.leg.agencyId);
    if(prev==='home'&&officeStart(la)){var lo=legOf(officeId(la),st.id);st.leg.office=true;st.leg.officeMiles=lo&&num(lo.miles)?lo.miles:null;if(lo&&lo.test)st.leg.test=true}
    legs.push(st.leg);prev=st.id});
  return {stops:stops,legs:legs,rows:rows,grp:grp};
}
function legRow(l){var ag=agency(l.agencyId);

    (l.miles!=null?l.miles+' mi':'Distance not set')+(l.min!=null?' · '+l.min+' min drive':'')+(ag?' · billed to '+esc(ag.name):'')+
    (l.office?'<br>Paid from the '+esc(ag.name)+' office: '+(l.officeMiles!=null?l.officeMiles+' mi':'distance not set'):'')+'</span>'+(l.test?'<span class="pill">test distance</span>':'')+'</div>'}

      '<div class="list">'+st.rows.map(rowHtml).join('')+'</div></div>';

function dayMinutes(date){var d=0,i=0;
  S.sessions.forEach(function(x){if(x.date===date&&x.status!=='planned'){if(!x.absent&&num(x.min))d+=x.min;if(num(x.indirect))i+=x.indirect}});
  S.indirect.forEach(function(x){if(x.date===date&&num(x.min))i+=x.min});return{d:d,i:i}}

function dayByAgency(date){var out={};
  function add(sid,m){var s=student(sid),a=s&&agencyOfStudent(s),k=a?a.id:'';out[k]=(out[k]||0)+m}
  S.sessions.forEach(function(x){if(x.date===date&&x.status!=='planned'){var m=(!x.absent&&num(x.min)?x.min:0)+(num(x.indirect)?x.indirect:0);if(m)add(x.studentId,m)}});
  S.indirect.forEach(function(x){if(x.date===date&&num(x.min))add(x.studentId,x.min)});return out}
function dayTotals(date,P){var out={};

  var by=dayByAgency(date);Object.keys(by).forEach(function(k){b(k).stu+=by[k]});
  P.legs.forEach(function(l){var x=b(l.agencyId);if(num(l.min))x.trav+=l.min;if(num(l.miles)){x.miles+=l.miles;if(taxMiles(agency(l.agencyId)))x.tax+=l.miles}});

  var h='<div class="panel stack"><span class="eyebrow">Day total</span>'+

    (r1(T.taxMiles)!==r1(T.miles)?'<div><div class="stat">'+r1(T.taxMiles)+'</div><span class="muted small">miles<br>for taxes</span></div>':'')+'</div>';
  if(ks.length)h+='<div class="split">'+ks.map(function(k){var a=agency(k),x=R.byAgency[k],paid=a&&(x.rates.base!=null||x.rates.travel!=null||x.rates.mile!=null);
      var bits=[hrs(x.studentMin+x.travelMin)+' hrs',r1(x.miles)+' mi'];

      if(a&&reimburses(a)&&x.rates.mile!=null&&x.paidMiles)bits.push(money(x.rates.mile)+'/mi');
      var note=(x.unpaid.length?' ('+x.unpaid.join(' and ')+' not paid)':'')+(x.missing.length?' · missing '+x.missing.filter(function(v,i,s){return s.indexOf(v)===i}).join(', '):'');
      return '<span>'+esc(a?a.name:'No agency set')+'</span><span class="muted small">'+esc(bits.join(' · ')+note)+'</span><span class="n">'+(paid?money(x.pay.total):'')+'</span>'}).join('')+'</div>';

/* Objectives to report on: current ones, plus ended ones that have data in the period. Ordered by annual goal, then objective number. */
function reportGoals(s,hs){var annual=(s.iep&&s.iep.annual)||[];
  function ai(g){var k=-1;annual.forEach(function(a,j){if(a.id===g.annualId)k=j});return k<0?999:k}
  return (s.goals||[]).filter(function(g){return !g.retired||hs.some(function(x){return x.values&&num(x.values[g.id])})})
    .map(function(g,k){return{g:g,k:k}}).sort(function(p,q){return ai(p.g)-ai(q.g)||((parseFloat(p.g.num)||99)-(parseFloat(q.g.num)||99))||p.k-q.k}).map(function(p){return p.g})}
function liveGoals(s){return (s.goals||[]).filter(function(g){return !g.retired})}
function hasData(sid,gid){return S.sessions.some(function(x){return x.studentId===sid&&x.values&&num(x.values[gid])})}
function stats(g,pts){var vs=pts.map(function(p){return p.v}),sum=vs.reduce(function(a,b){return a+b},0);
  return{avg:r1(sum/vs.length),min:Math.min.apply(null,vs),max:Math.max.apply(null,vs),
    metN:num(g.target)?pts.filter(function(p){return met(g,p.v)}).length:null}}
function chart(g,pts){
  var W=320,H=130,L=28,R=10,T=10,B=22,top=Math.max.apply(null,pts.map(function(p){return p.v}).concat(num(g.target)?[g.target]:[]));
  top=Math.max(1,Math.ceil(top*1.15));
  function x(i){return pts.length===1?(L+W-R)/2:L+(W-L-R)*i/(pts.length-1)}
  function y(v){return T+(H-T-B)*(1-v/top)}
  var o='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(g.label)+' by session">';
  [0,top/2,top].forEach(function(t){o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-5)+'" y="'+(y(t)+4)+'" text-anchor="end">'+r1(t)+'</text>'});
  if(num(g.target))o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g.target)+'" y2="'+y(g.target)+'" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 3"/>';
  if(pts.length>1)o+='<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="'+pts.map(function(p,i){return x(i)+','+y(p.v)}).join(' ')+'"/>';
  pts.forEach(function(p,i){var last=i===pts.length-1;o+='<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="'+(last?4.5:3)+'" fill="'+(last?'var(--accent)':'var(--surface)')+'" stroke="var(--accent)" stroke-width="2"/>'});
  o+='<text x="'+L+'" y="'+(H-5)+'">'+esc(md(pts[0].d))+'</text>';
  if(pts.length>1)o+='<text x="'+(W-R)+'" y="'+(H-5)+'" text-anchor="end">'+esc(md(pts[pts.length-1].d))+'</text>';
  return o+'</svg>';
}
function summary(s,hs){
  var abs=hs.filter(function(x){return x.absent}).length,att=hs.length-abs;
  var out=[s.name+': progress '+mdy(hs[0].date)+' to '+mdy(hs[hs.length-1].date)+' ('+att+' session'+(att===1?'':'s')+(abs?', '+abs+' absent':'')+')',''];
  var dm=0,im=0;hs.forEach(function(x){if(num(x.min))dm+=x.min;if(num(x.indirect))im+=x.indirect});
  S.indirect.forEach(function(x){if(x.studentId===s.id&&inPeriod(x)&&num(x.min))im+=x.min});
  if(dm||im)out.splice(1,0,'Service time: '+dm+' direct min, '+im+' indirect min.');
  var goalsR=reportGoals(s,hs),lastA=null,annual=(s.iep&&s.iep.annual)||[];
  goalsR.forEach(function(g){
    var pts=hs.filter(function(x){return !x.absent&&x.values&&num(x.values[g.id])});
    var a=annual.filter(function(q){return q.id===g.annualId})[0];
    if(a&&a!==lastA&&a.text){out.push((a.num?'Goal '+a.num:'Annual goal')+': '+a.text,'');lastA=a}
    var nth=g.num||String(goalsR.filter(function(q){return q.text}).indexOf(g)+1);
    var head=g.num?'Objective '+g.num+': '+(g.text||g.label)+(g.retired?' (ended '+md(g.retired)+')':''):(g.text?'Objective '+nth+': '+g.text:g.label+':');
    if(!pts.length){out.push(head,'Progress: no data recorded this period.','');return}
    var p=pts.map(function(x){return{d:x.date,v:x.values[g.id]}}),st=stats(g,p),l=pts[pts.length-1],vr=l.variants&&l.variants[g.id];
    out.push(head,'Progress: '+s.name+' averaged '+st.avg+' '+g.unit+' (range '+st.min+' to '+st.max+') across '+pts.length+' session'+(pts.length===1?'':'s')+
      (st.metN!=null?'; '+(g.dir==='max'?'at or under ':'met target of ')+g.target+' '+g.unit+' in '+st.metN+' of '+pts.length:'')+
      '. Most recent: '+l.values[g.id]+' '+g.unit+(l.outof&&num(l.outof[g.id])?' out of '+l.outof[g.id]:'')+(vr?' ('+vr+')':'')+(l.help&&l.help[g.id]?', '+l.help[g.id].toLowerCase():'')+' on '+md(l.date)+'.','');
  });
  var notes=hs.filter(function(x){return x.note}).slice(-5);
  if(notes.length){out.push('','Recent notes:');notes.forEach(function(x){out.push(md(x.date)+': '+x.note)})}
  return out.join('\n');
}

function geoMark(i){GEO.sel=i;document.querySelectorAll('.geo-list [data-geoi]').forEach(function(b){b.setAttribute('aria-selected',String(+b.dataset.geoi===i))});
  if(GEO.input)GEO.input.setAttribute('aria-activedescendant',i>=0?'geo-opt-'+i:'')}
function geoLookup(input){
  var q=input.value.trim();clearTimeout(GEO.timer);if(GEO.ctrl)GEO.ctrl.abort();
  if(q.length<3){geoClose();return}
  if(GEO.cache[q]){geoShow(input,GEO.cache[q]);return}
  GEO.timer=setTimeout(function(){
    var ctrl=window.AbortController?new AbortController():null;GEO.ctrl=ctrl;
    fetch('https://api.geoapify.com/v1/geocode/autocomplete?text='+encodeURIComponent(q)+'&filter=countrycode:us&format=json&limit=5&lang=en&apiKey='+GEO_KEY,ctrl?{signal:ctrl.signal}:{})
      .then(function(r){if(!r.ok)throw new Error('status '+r.status);return r.json()})
      .then(function(j){var items=(j.results||[]).filter(function(r){return r&&r.formatted&&typeof r.lat==='number'&&typeof r.lon==='number'}).map(function(r){var us=/,\s*United States( of America)?$/;
          return{formatted:r.formatted.replace(us,''),address_line1:r.address_line1,address_line2:(r.address_line2||'').replace(us,''),lat:r.lat,lon:r.lon}});
        GEO.cache[q]=items;if(document.activeElement===input&&input.value.trim()===q)geoShow(input,items,items.length?'':'No matching addresses. You can keep what you typed.')})
      .catch(function(e){if(e&&e.name==='AbortError')return;if(document.activeElement===input)geoShow(input,[],'Address suggestions are not available right now. You can type the full address.')});
  },350);
}
function geoPick(i){var r=GEO.items[i],input=GEO.input;if(!r||!input)return;
  input.value=r.formatted;GEO.picked[input.id]={address:r.formatted,lat:r.lat,lon:r.lon};
  input.dispatchEvent(new Event('input',{bubbles:true}));geoClose();clearTimeout(GEO.timer);
  if(input.dataset.agf){var dg=agD(input.dataset.agw);if(dg){dg.officeLat=r.lat;dg.officeLon=r.lon}}}
/* Coordinates to save with an address: the picked suggestion if the text still matches it, else the stored ones if the address is unchanged. */
function geoFor(id,address,prev){var g=GEO.picked[id];
  if(g&&g.address===address)return{lat:g.lat,lon:g.lon};
  if(prev&&prev.address===address&&typeof prev.lat==='number')return{lat:prev.lat,lon:prev.lon};
  return{lat:null,lon:null}}
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.geo){if(GEO.picked[t.id]&&GEO.picked[t.id].address!==t.value.trim()){delete GEO.picked[t.id];
  if(t.dataset.agf){var dg=agD(t.dataset.agw);if(dg){dg.officeLat=null;dg.officeLon=null}}}
  if(!GEO.picked[t.id])geoLookup(t)}});
document.addEventListener('keydown',function(e){var t=e.target;if(!(t.dataset&&t.dataset.geo)||!document.querySelector('.geo-list'))return;
  if(e.key==='ArrowDown'&&GEO.items.length){e.preventDefault();geoMark((GEO.sel+1)%GEO.items.length)}
  else if(e.key==='ArrowUp'&&GEO.items.length){e.preventDefault();geoMark((GEO.sel-1+GEO.items.length)%GEO.items.length)}
  else if(e.key==='Enter'&&GEO.sel>=0){e.preventDefault();geoPick(GEO.sel)}
  else if(e.key==='Escape'){e.stopPropagation();geoClose()}},true);

function makeDb(uid){
  var cache={},L={},loaded=load();
  function load(){var rows=[];
    function page(from){return sb.from('dape_docs').select('coll,id,data').order('coll').order('id').range(from,from+999).then(function(r){
      if(r.error)throw r.error;rows=rows.concat(r.data);return r.data.length===1000?page(from+1000):rows})}

  function snap(c){return{docs:Object.keys(cache[c]||{}).sort().map(function(id){return{id:id,data:function(){return cache[c][id]}}})}}
  function notify(c){(L[c]||[]).forEach(function(f){f(snap(c))})}

  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')load().then(function(){Object.keys(L).forEach(notify)},function(){})});
