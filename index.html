<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>DAPE Session Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: single phone column, sticky tab bar at the bottom, one student per row like her paper sheet. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#17231d; --muted:#5d6b63; --line:#d5dbd6;
  --accent:#1f6b4a; --accent-ink:#ffffff; --accent-soft:#dcebe2;
  --good:#1f6b4a; --warn:#a85d00; --bad:#a3322a;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111815; --surface:#1a231f; --ink:#e8efea; --muted:#9aa9a0; --line:#2f3b35;
  --accent:#58c08f; --accent-ink:#0c1511; --accent-soft:#1f3329;
  --good:#58c08f; --warn:#e0a44a; --bad:#ef8279; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#111815; --surface:#1a231f; --ink:#e8efea; --muted:#9aa9a0; --line:#2f3b35;
  --accent:#58c08f; --accent-ink:#0c1511; --accent-soft:#1f3329;
  --good:#58c08f; --warn:#e0a44a; --bad:#ef8279; color-scheme:dark }
*{box-sizing:border-box}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 96px;display:flex;flex-direction:column;gap:16px}
h1{font:700 28px/1.1 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font:700 20px/1.15 var(--display);margin:0}
.eyebrow{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{align-items:flex-end}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.stack>label,.wrap>label{flex:0 0 auto}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;width:100%;padding:14px;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;min-height:56px}
.item:first-child{border-top:0}
.item .nm{font-weight:600;min-width:0;flex:1}
.item .sub{font-weight:400;font-size:14px;color:var(--muted)}
.time{font:700 18px/1 var(--display);font-variant-numeric:tabular-nums;min-width:68px}
.pill{font:600 12px var(--body);padding:3px 9px;border-radius:99px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pill.done{background:var(--accent-soft);color:var(--good);border-color:transparent}
.pill.abs{color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.edit{padding:0 14px 14px;border-top:1px dashed var(--line);padding-top:12px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--good)}
.btn:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
/* 16px stops phones zooming in when a field is tapped; the date and time rules stop iPhone fields spilling out of their column */
input,select,textarea{font-size:16px;max-width:100%}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
html,body{max-width:100%;overflow-x:hidden}
.row>label{align-self:flex-end}
.sec{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:12px;border:0;background:var(--bg);color:inherit;font:inherit;text-align:left;cursor:pointer;min-height:52px}
.sechead .sub{font-size:14px;color:var(--muted)}
.secbody{padding:12px}
.chev{font:700 24px/1 var(--display);color:var(--accent);flex:none}
label{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:4px;flex:1 1 130px;min-width:0}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font:700 26px var(--display);cursor:pointer}
.stepper input{width:84px;text-align:center;font:700 30px var(--display);font-variant-numeric:tabular-nums;height:52px;padding:4px}
.goal{padding-block:12px;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0;padding-top:0}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 12px;min-height:36px;cursor:pointer;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;max-width:150px;border:0;background:none;padding:14px 2px;font:700 15px var(--display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
.tabs button.on{color:var(--accent);border-top-color:var(--accent)}
.banner{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:14px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));margin:auto;max-width:400px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;text-align:center;font-weight:600}
.stat{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
svg{display:block;width:100%;height:auto}
svg text{font:500 11px var(--body);fill:var(--muted)}
pre.sum{white-space:pre-wrap;word-break:break-word;font:14px/1.45 var(--body);margin:0;user-select:all}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
</style>

</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<div class="wrap" id="auth" hidden>
  <div class="stack"><span class="eyebrow">DAPE Session Log</span><h1>Sign in</h1></div>
  <form class="panel stack" id="auth-form">
    <label>Email<input type="email" id="auth-email" autocomplete="username" inputmode="email" required></label>
    <label>Password<input type="password" id="auth-pass" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit" id="auth-go">Sign in</button>
  </form>
  <p class="muted" id="auth-msg" role="status"></p>
</div>
<div class="wrap" id="app" hidden></div>
<nav class="tabs" id="tabs" hidden></nav>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
var S={view:'today',date:today(),students:[],schools:[],sessions:[],activities:[],indirect:[],days:[],indForm:false,sec:'details',scSec:'details',loaded:false,db:null,dbState:'wait',
       open:null,draft:null,progId:null,period:'all',editId:null,schoolEdit:null,saving:false};
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var HELP=['Independent','Verbal cue','Demonstration','Hands-on help'];
var CODES=[['401','S/LI','Speech/Language Impaired'],['402','DCD-MM','Developmental Cognitive Disabilities: Mild-Moderate'],['403','DCD-SP','Developmental Cognitive Disabilities: Severe-Profound'],
  ['404','PI','Physically Impaired'],['405','D/HH','Deaf/Hard of Hearing'],['406','B/VI','Blind/Visually Impaired'],['407','SLD','Specific Learning Disabilities'],
  ['408','EBD','Emotional or Behavioral Disorders'],['410','OHD','Other Health Disabilities'],['411','ASD','Autism Spectrum Disorders'],['412','D/D','Developmentally Delayed'],
  ['414','TBI','Traumatic Brain Injury'],['416','SMI','Severely Multiply Impaired'],['420','Aggregate','Special Education Aggregate (three or more disabilities)'],['422','Non-disabled','Non-Disabled (no IEP/IFSP)']];
var app=document.getElementById('app'),tabs=document.getElementById('tabs'),toastEl=document.getElementById('toast');

function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function p2(n){return (n<10?'0':'')+n}
function parts(s){var a=s.split('-');return[+a[0],+a[1],+a[2]]}
function md(s){var a=parts(s);return a[1]+'/'+a[2]}
function mdy(s){var a=parts(s);return a[1]+'/'+a[2]+'/'+a[0]}
function longDate(s){var a=parts(s);return new Date(a[0],a[1]-1,a[2]).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}
function shift(s,n){var a=parts(s),d=new Date(a[0],a[1]-1,a[2]+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function dow(s){var a=parts(s);return new Date(a[0],a[1]-1,a[2]).getDay()}
function wk(s){var a=parts(s);return Math.floor((Date.UTC(a[0],a[1]-1,a[2])/864e5+4)/7)} /* Sunday-start week number */
function fmtTime(t){if(!t)return '';var a=t.split(':'),h=+a[0];return ((h+11)%12+1)+':'+a[1]+(h<12?' am':' pm')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rid(){return Math.random().toString(36).slice(2,9)}
function num(v){return typeof v==='number'&&isFinite(v)}
function r1(n){return Math.round(n*10)/10}
function toast(t){toastEl.textContent=t;toastEl.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){toastEl.hidden=true},2600)}
function student(id){return S.students.filter(function(s){return s.id===id})[0]}
function school(id){return S.schools.filter(function(s){return s.id===id})[0]}
function schoolLabel(s){var sc=school(s.schoolId);return sc?(sc.alias||sc.name):(s.site||'')}
function closedOn(sc,date){return (sc.closed||[]).filter(function(c){return date>=c.from&&date<=(c.to||c.from)})[0]}
function slotOn(s,date){var d=dow(date);return (s.slots||[]).filter(function(sl){
  return sl.day===d&&(sl.every!==2||!sl.anchor||(wk(date)-wk(sl.anchor))%2===0)})[0]}
function slotText(sl){return DAYS[sl.day]+' '+fmtTime(sl.time)+', '+sl.min+' min'+(sl.every===2?', every 2 weeks':'')}
function sess(sid,date){return S.sessions.filter(function(x){return x.studentId===sid&&x.date===date})[0]}
function history(sid){return S.sessions.filter(function(x){return x.studentId===sid&&x.status!=='planned'}).sort(function(a,b){return a.date<b.date?-1:1})}
function lastVal(sid,gid,before){var h=history(sid),i;for(i=h.length-1;i>=0;i--){if(h[i].date<before&&h[i].values&&num(h[i].values[gid]))return h[i]}return null}
function met(g,v){return !num(g.target)?null:(g.dir==='max'?v<=g.target:v>=g.target)}

/* ---------- data ---------- */
function start(db){
  render();
  (function(){
    S.db=db;S.dbState='ok';var got={};
    function fail(){S.dbState='none';S.loaded=true;render()}
    function sub(name,q,fn){q.onSnapshot(function(snap){fn(snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o}));
      got[name]=1;if(got.students&&got.schools&&got.sessions)S.loaded=true;softRender()},fail)}
    sub('students',db.collection('students'),function(a){a.forEach(function(o){o.goals=o.goals||[];o.slots=o.slots||[]});
      S.students=a.sort(function(x,y){return (x.order||0)-(y.order||0)||String(x.name).localeCompare(y.name)})});
    sub('schools',db.collection('schools'),function(a){S.schools=a.sort(function(x,y){return String(x.name).localeCompare(y.name)})});
    sub('sessions',db.collection('sessions').limit(1000),function(a){S.sessions=a});
    sub('activities',db.collection('activities'),function(a){S.activities=a.sort(function(x,y){return String(x.name).localeCompare(String(y.name))})});
    sub('indirect',db.collection('indirect').limit(1000),function(a){S.indirect=a});
    sub('days',db.collection('days').limit(1000),function(a){S.days=a});
  })();
}
/* Don't redraw under her thumbs while an entry or form is open. */
function softRender(){var a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;render()}
function write(p){ if(!S.db){toast('Saving is not available in this view');return Promise.reject()}
  return p().catch(function(e){toast(e&&e.code==='quota_exceeded'?'Storage is full. Delete old entries.':'Could not save. Check your connection and try again.');throw e})}
function saveDoc(coll,o,patch,msg){var d=Object.assign({},o,patch);delete d.id;
  write(function(){return S.db.doc(coll+'/'+o.id).set(d)}).then(function(){toast(msg);render()},function(){})}

/* ---------- views ---------- */
function render(){
  tabs.innerHTML=[['schools','Schools'],['students','Students'],['today','Sessions'],['progress','Progress']].map(function(t){
    return '<button data-act="tab" data-v="'+t[0]+'" class="'+(S.view===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('');
  var h='';
  if(S.dbState==='none')h+='<div class="banner">Could not reach your data. Check your connection, then close and reopen the app.</div>';
  if(S.view==='today')h+=S.open?entryView():todayView();
  else if(S.view==='progress')h+=progressView();
  else if(S.view==='students')h+=studentsView();
  else h+=schoolsView();
  app.innerHTML=h;
}
function emptyRoster(){return '<div class="list"><div class="empty">'+(S.loaded?'No students yet. Add your caseload on the Students tab, with the goals you track for each.':'Loading your caseload…')+'</div></div>'}

function comingUp(){
  var t=today(),out=[];
  S.students.forEach(function(s){if(s.iepNext&&s.iepNext>=t&&s.iepNext<=shift(t,30))out.push({d:s.iepNext,t:'IEP meeting, '+s.name})});
  S.schools.forEach(function(sc){(sc.reports||[]).forEach(function(r){if(r.date>=t&&r.date<=shift(t,21))out.push({d:r.date,t:'Report due, '+(sc.alias||sc.name)+(r.label?' ('+r.label+')':'')})})});
  if(!out.length)return '';
  out.sort(function(a,b){return a.d<b.d?-1:1});
  return '<div class="panel stack"><span class="eyebrow">Coming up</span>'+out.map(function(o){
    return '<div class="row"><span class="time">'+esc(md(o.d))+'</span><span style="flex:1;min-width:0">'+esc(o.t)+'</span></div>'}).join('')+'</div>';
}
function todayView(){
  var sched=[],other=[],grp={};
  S.students.forEach(function(s){var sl=slotOn(s,S.date);if(sl){sched.push({s:s,sl:sl});var k=(s.schoolId||'')+'|'+sl.time;grp[k]=(grp[k]||0)+1}else other.push({s:s})});
  sched.sort(function(a,b){return a.sl.time<b.sl.time?-1:a.sl.time>b.sl.time?1:0});
  var done=sched.filter(function(o){var x=sess(o.s.id,S.date);return x&&x.status!=='planned'}).length;
  var here=S.schools.filter(function(sc){return (sc.days||[]).indexOf(dow(S.date))>=0}).map(function(sc){return sc.alias||sc.name});
  var h='<div class="stack"><span class="eyebrow">Session log</span><h1>'+esc(longDate(S.date))+'</h1>'+
    '<div class="row"><button class="btn" data-act="day" data-n="-1" aria-label="Previous day">‹</button>'+
    '<input type="date" id="date-pick" value="'+S.date+'" style="flex:1;width:auto">'+
    '<button class="btn" data-act="day" data-n="1" aria-label="Next day">›</button>'+
    (S.date!==today()?'<button class="btn" data-act="todaybtn">Today</button>':'')+'</div>'+
    (here.length?'<strong>At '+esc(here.join(' and '))+'</strong>':'')+
    (S.students.length?'<span class="muted small">'+(sched.length?done+' of '+sched.length+' scheduled sessions logged':'Nothing scheduled this day')+'</span>':'')+'</div>';
  if(S.date===today())h+=comingUp();
  if(!S.students.length)return h+emptyRoster();
  function rowHtml(o){
    var s=o.s,x=sess(s.id,S.date),pill='<span class="pill">Not logged</span>',sc=school(s.schoolId),cl=sc&&closedOn(sc,S.date);
    if(x)pill=x.status==='planned'?'<span class="pill">Planned</span>':x.absent?'<span class="pill abs">Absent</span>':'<span class="pill done">Logged</span>';
    var sub=[schoolLabel(s),o.sl?o.sl.min+' direct'+(s.indirect?' / '+s.indirect+' indirect':''):'',o.sl&&grp[(s.schoolId||'')+'|'+o.sl.time]>1?'group':'',cl?'school closed'+(cl.label?' ('+cl.label+')':''):''].filter(Boolean).join(' · ');
    return '<button class="item" data-act="open" data-id="'+esc(s.id)+'">'+(o.sl?'<span class="time">'+esc(fmtTime(o.sl.time))+'</span>':'')+
      '<span class="nm">'+esc(s.name)+(sub?'<br><span class="sub">'+esc(sub)+'</span>':'')+'</span>'+pill+'</button>'}
  if(sched.length)h+='<div class="list">'+sched.map(rowHtml).join('')+'</div>';
  if(other.length)h+=(sched.length||S.students.some(function(s){return s.slots.length})?'<span class="eyebrow">Not scheduled this day</span>':'')+'<div class="list">'+other.map(rowHtml).join('')+'</div>';
  return h+dayPanel();
}
function dayMinutes(date){var d=0,i=0;
  S.sessions.forEach(function(x){if(x.date===date&&x.status!=='planned'){if(!x.absent&&num(x.min))d+=x.min;if(num(x.indirect))i+=x.indirect}});
  S.indirect.forEach(function(x){if(x.date===date&&num(x.min))i+=x.min});return{d:d,i:i}}
function hrs(m){return Math.round(m/60*100)/100}
function dayPanel(){
  var m=dayMinutes(S.date),dd=S.days.filter(function(x){return x.id===S.date})[0],tr=dd&&num(dd.travel)?dd.travel:0;
  var h='<div class="panel stack"><span class="eyebrow">Day total</span>'+
    '<div class="row" style="gap:22px"><div><div class="stat">'+hrs(m.d+m.i)+'</div><span class="muted small">student hours<br>'+m.d+' direct + '+m.i+' indirect min</span></div>'+
    '<div><div class="stat">'+hrs(m.d+m.i+tr*60)+'</div><span class="muted small">total hours<br>with travel</span></div></div>'+
    '<div class="row end"><label>Travel time (hours)<input type="number" inputmode="decimal" step="0.25" id="travel" value="'+(tr||'')+'" placeholder="0"></label><button class="btn" data-act="savetravel">Save travel</button></div>';
  S.indirect.filter(function(x){return x.date===S.date}).forEach(function(x){var st=student(x.studentId);
    h+='<div class="row spread"><span style="min-width:0;flex:1">'+esc((st?st.name:'Removed student')+', '+x.min+' indirect min'+(x.note?', '+x.note:''))+'</span><button class="chip" data-act="rmind" data-id="'+esc(x.id)+'">Remove</button></div>'});
  if(S.indForm)h+='<div class="row"><label>Student<select id="ind-student"><option value="">Pick a student</option>'+S.students.map(function(s){return '<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>'}).join('')+'</select></label>'+
    '<label>Indirect minutes<input type="number" inputmode="numeric" id="ind-min"></label></div>'+
    '<label>What it was<input id="ind-note" placeholder="Phone call, meeting, talking with a para. No real names."></label>'+
    '<div class="row"><button class="btn primary" style="flex:1" data-act="addind">Save indirect time</button><button class="btn" data-act="indform">Cancel</button></div>';
  else h+='<button class="btn" data-act="indform">Add indirect time outside a session</button>';
  return h+'</div>';
}
function extraInputs(g,d){var h='';
  if(g.kind==='ratio')h+='<div class="row"><label style="flex:0 1 200px">Out of how many tries<input type="number" inputmode="numeric" id="of-'+esc(g.id)+'" data-g="'+esc(g.id)+'" data-x="outof" value="'+(num(d.outof[g.id])?d.outof[g.id]:'')+'"></label></div>';
  return h+'<div class="row">'+HELP.map(function(v){return '<button class="chip '+(d.help[g.id]===v?'on':'')+'" data-act="help" data-g="'+esc(g.id)+'" data-v="'+v+'">'+v+'</button>'}).join('')+'</div>'}
function minutesPanel(s,d){
  var h='<div class="panel stack"><div class="row"><label>Direct minutes<input type="number" inputmode="numeric" id="e-min" value="'+(num(d.min)?d.min:'')+'"'+(d.absent?' disabled':'')+'></label>'+
    '<label>Indirect minutes<input type="number" inputmode="numeric" id="e-ind" value="'+(num(d.indirect)?d.indirect:'')+'"></label></div></div>';
  if(d.absent)return h;
  var names=S.activities.map(function(a){return String(a.name)});d.acts.forEach(function(n){if(names.indexOf(n)<0)names.push(n)});
  return h+'<div class="panel stack"><strong>Activities</strong>'+

function stats(g,pts){var vs=pts.map(function(p){return p.v}),sum=vs.reduce(function(a,b){return a+b},0);
  return{avg:r1(sum/vs.length),min:Math.min.apply(null,vs),max:Math.max.apply(null,vs),
    metN:num(g.target)?pts.filter(function(p){return met(g,p.v)}).length:null}}
function chart(g,pts){
  var W=320,H=130,L=28,R=10,T=10,B=22,top=Math.max.apply(null,pts.map(function(p){return p.v}).concat(num(g.target)?[g.target]:[]));
  top=Math.max(1,Math.ceil(top*1.15));
  function x(i){return pts.length===1?(L+W-R)/2:L+(W-L-R)*i/(pts.length-1)}
  function y(v){return T+(H-T-B)*(1-v/top)}
  var o='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(g.label)+' by session">';
  [0,top/2,top].forEach(function(t){o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-5)+'" y="'+(y(t)+4)+'" text-anchor="end">'+r1(t)+'</text>'});
  if(num(g.target))o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g.target)+'" y2="'+y(g.target)+'" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 3"/>';
  if(pts.length>1)o+='<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="'+pts.map(function(p,i){return x(i)+','+y(p.v)}).join(' ')+'"/>';
  pts.forEach(function(p,i){var last=i===pts.length-1;o+='<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="'+(last?4.5:3)+'" fill="'+(last?'var(--accent)':'var(--surface)')+'" stroke="var(--accent)" stroke-width="2"/>'});
  o+='<text x="'+L+'" y="'+(H-5)+'">'+esc(md(pts[0].d))+'</text>';
  if(pts.length>1)o+='<text x="'+(W-R)+'" y="'+(H-5)+'" text-anchor="end">'+esc(md(pts[pts.length-1].d))+'</text>';
  return o+'</svg>';
}
function summary(s,hs){
  var abs=hs.filter(function(x){return x.absent}).length,att=hs.length-abs;
  var out=[s.name+': progress '+mdy(hs[0].date)+' to '+mdy(hs[hs.length-1].date)+' ('+att+' session'+(att===1?'':'s')+(abs?', '+abs+' absent':'')+')',''];
  var dm=0,im=0;hs.forEach(function(x){if(num(x.min))dm+=x.min;if(num(x.indirect))im+=x.indirect});
  S.indirect.forEach(function(x){if(x.studentId===s.id&&inPeriod(x)&&num(x.min))im+=x.min});
  if(dm||im)out.splice(1,0,'Service time: '+dm+' direct min, '+im+' indirect min.');
  s.goals.forEach(function(g){
    var pts=hs.filter(function(x){return !x.absent&&x.values&&num(x.values[g.id])});
    var head=g.text?'Objective '+(s.goals.filter(function(q){return q.text}).indexOf(g)+1)+': '+g.text:g.label+':';
    if(!pts.length){out.push(head,'Progress: no data recorded this period.','');return}
    var p=pts.map(function(x){return{d:x.date,v:x.values[g.id]}}),st=stats(g,p),l=pts[pts.length-1],vr=l.variants&&l.variants[g.id];
    out.push(head,'Progress: '+s.name+' averaged '+st.avg+' '+g.unit+' (range '+st.min+' to '+st.max+') across '+pts.length+' session'+(pts.length===1?'':'s')+
      (st.metN!=null?'; '+(g.dir==='max'?'at or under ':'met target of ')+g.target+' '+g.unit+' in '+st.metN+' of '+pts.length:'')+
      '. Most recent: '+l.values[g.id]+' '+g.unit+(l.outof&&num(l.outof[g.id])?' out of '+l.outof[g.id]:'')+(vr?' ('+vr+')':'')+(l.help&&l.help[g.id]?', '+l.help[g.id].toLowerCase():'')+' on '+md(l.date)+'.','');
  });
  var notes=hs.filter(function(x){return x.note}).slice(-5);
  if(notes.length){out.push('','Recent notes:');notes.forEach(function(x){out.push(md(x.date)+': '+x.note)})}
  return out.join('\n');
}

  else if(a==='code'){s=student(b.dataset.id);if(!s)return;var cs=(s.codes||'').split('/').filter(Boolean),ci=cs.indexOf(b.dataset.v);

  else if(a==='saveschool'){sc=school(b.dataset.id);if(!sc)return;if(!val('sc-name')){toast('The school name is required');return}

  else if(a==='addclosed'){sc=school(b.dataset.id);var f=val('c-from'),to=val('c-to')||f;if(!sc)return;

  else if(a==='addreport'){sc=school(b.dataset.id);var rd=val('r-date');if(!sc)return;if(!rd){toast('Pick the due date');return}
    saveDoc('schools',sc,{reports:(sc.reports||[]).concat([{date:rd,label:val('r-label')}]).sort(byDate('date'))},'Due date added');return}
  else if(a==='rmreport'){sc=school(b.dataset.id);if(sc)saveDoc('schools',sc,{reports:(sc.reports||[]).filter(function(_,k){return k!==i})},'Due date removed');return}

function makeDb(uid){
  var cache={},L={},loaded=load();
  function load(){var rows=[];
    function page(from){return sb.from('dape_docs').select('coll,id,data').order('coll').order('id').range(from,from+999).then(function(r){
      if(r.error)throw r.error;rows=rows.concat(r.data);return r.data.length===1000?page(from+1000):rows})}
    return page(0).then(function(all){cache={};all.forEach(function(r){(cache[r.coll]=cache[r.coll]||{})[r.id]=r.data})})}
  function snap(c){return{docs:Object.keys(cache[c]||{}).sort().map(function(id){return{id:id,data:function(){return cache[c][id]}}})}}
  function notify(c){(L[c]||[]).forEach(function(f){f(snap(c))})}
  /* pick up changes made on her other phone whenever the app comes back to the front */
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')load().then(function(){Object.keys(L).forEach(notify)},function(){})});

    collection:function(c){var q={limit:function(){return q},onSnapshot:function(f,err){(L[c]=L[c]||[]).push(f);loaded.then(function(){f(snap(c))},function(e){if(err)err(e)});return function(){}}};return q},
    doc:function(p){var a=p.split('/');return{
      set:function(d){return sb.from('dape_docs').upsert({user_id:uid,coll:a[0],id:a[1],data:d,updated_at:new Date().toISOString()},{onConflict:'user_id,coll,id'}).then(function(r){
        if(r.error)throw r.error;(cache[a[0]]=cache[a[0]]||{})[a[1]]=d;notify(a[0])})},
      delete:function(){return sb.from('dape_docs').delete().eq('user_id',uid).eq('coll',a[0]).eq('id',a[1]).then(function(r){
        if(r.error)throw r.error;if(cache[a[0]])delete cache[a[0]][a[1]];notify(a[0])})}}}};
}
